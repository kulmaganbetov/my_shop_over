<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Роберт - AI Ассистент | Over-Shop.kz</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --primary-light: #818cf8;
            --bg-main: #f8fafc;
            --bg-card: #ffffff;
            --bg-input: #f1f5f9;
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --text-muted: #94a3b8;
            --accent-green: #10b981;
            --accent-blue: #3b82f6;
            --border: #e2e8f0;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-main);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .chat-container {
            width: 100%;
            max-width: 800px;
            height: 90vh;
            max-height: 900px;
            background: var(--bg-card);
            border-radius: 24px;
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: var(--shadow);
        }

        /* Header */
        .chat-header {
            padding: 20px 24px;
            background: var(--bg-card);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .logo-container {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--accent-blue) 100%);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 20px;
            color: white;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
        }

        .header-info {
            flex: 1;
        }

        .header-title {
            font-size: 18px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-primary);
        }

        .header-subtitle {
            font-size: 13px;
            color: var(--text-secondary);
            margin-top: 2px;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            transition: all 0.3s ease;
        }

        .status-badge.bot {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.2);
            color: var(--accent-green);
        }

        .status-badge.waiting {
            background: rgba(245, 158, 11, 0.1);
            border: 1px solid rgba(245, 158, 11, 0.2);
            color: #f59e0b;
        }

        .status-badge.manager {
            background: rgba(59, 130, 246, 0.1);
            border: 1px solid rgba(59, 130, 246, 0.2);
            color: var(--accent-blue);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        .status-dot.bot { background: var(--accent-green); }
        .status-dot.waiting { background: #f59e0b; }
        .status-dot.manager { background: var(--accent-blue); }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* Manager message style */
        .message.manager .message-avatar {
            background: linear-gradient(135deg, var(--accent-blue) 0%, #1d4ed8 100%);
            color: white;
        }

        .message.manager .message-content {
            background: var(--bg-card);
            border: 2px solid var(--accent-blue);
            border-bottom-left-radius: 6px;
            color: var(--text-primary);
        }

        /* System notification */
        .system-notification {
            text-align: center;
            padding: 12px 20px;
            background: rgba(59, 130, 246, 0.1);
            border: 1px solid rgba(59, 130, 246, 0.2);
            border-radius: 12px;
            color: var(--accent-blue);
            font-size: 13px;
            margin: 8px 0;
            animation: fadeIn 0.3s ease;
        }

        /* Messages */
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            background: var(--bg-main);
        }

        .chat-messages::-webkit-scrollbar {
            width: 6px;
        }

        .chat-messages::-webkit-scrollbar-track {
            background: transparent;
        }

        .chat-messages::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 3px;
        }

        .message {
            display: flex;
            gap: 12px;
            max-width: 85%;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .message-avatar {
            width: 36px;
            height: 36px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 600;
            flex-shrink: 0;
        }

        .message.assistant .message-avatar {
            background: linear-gradient(135deg, var(--primary) 0%, var(--accent-blue) 100%);
            color: white;
        }

        .message.user .message-avatar {
            background: var(--border);
            color: var(--text-secondary);
        }

        .message-content {
            padding: 14px 18px;
            border-radius: 18px;
            font-size: 14px;
            line-height: 1.6;
        }

        .message.assistant .message-content {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-bottom-left-radius: 6px;
            color: var(--text-primary);
        }

        .message.user .message-content {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            border-bottom-right-radius: 6px;
            color: white;
        }

        .message-time {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 6px;
        }

        .message.user .message-time {
            text-align: right;
        }

        /* Typing indicator */
        .typing-indicator {
            display: flex;
            gap: 4px;
            padding: 14px 18px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 18px;
            border-bottom-left-radius: 6px;
            width: fit-content;
        }

        .typing-indicator span {
            width: 8px;
            height: 8px;
            background: var(--text-muted);
            border-radius: 50%;
            animation: typing 1.4s infinite;
        }

        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typing {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-8px); }
        }

        /* Suggestions */
        .suggestions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 12px;
        }

        .suggestion-btn {
            padding: 8px 14px;
            background: var(--bg-main);
            border: 1px solid var(--border);
            border-radius: 20px;
            color: var(--text-secondary);
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .suggestion-btn:hover {
            background: var(--primary);
            border-color: var(--primary);
            color: white;
        }

        /* Input area */
        .chat-input-area {
            padding: 20px 24px;
            background: var(--bg-card);
            border-top: 1px solid var(--border);
        }

        .input-container {
            display: flex;
            align-items: center;
            gap: 12px;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 8px;
            transition: border-color 0.2s;
        }

        .input-container:focus-within {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        .chat-input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-primary);
            font-size: 14px;
            padding: 8px 12px;
            font-family: inherit;
            resize: none;
            min-height: 24px;
            max-height: 120px;
            line-height: 1.5;
        }

        .chat-input::placeholder {
            color: var(--text-muted);
        }

        /* Status message while bot is thinking */
        .thinking-status {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 12px 18px;
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.1), rgba(59, 130, 246, 0.1));
            border: 1px solid rgba(99, 102, 241, 0.2);
            border-radius: 12px;
            font-size: 14px;
            color: var(--primary);
        }

        .thinking-status .spinner-svg {
            flex-shrink: 0;
            vertical-align: middle;
        }

        .thinking-status span {
            font-weight: 500;
            line-height: 16px;
        }

        /* Uploaded image in chat */
        .message-image {
            max-width: 250px;
            max-height: 200px;
            border-radius: 12px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .message-image:hover {
            transform: scale(1.02);
        }

        .message.user .message-image {
            border: 2px solid rgba(255, 255, 255, 0.3);
        }

        /* Image preview before sending */
        .file-preview-image {
            max-width: 120px;
            max-height: 80px;
            border-radius: 8px;
            object-fit: cover;
        }

        /* Typing effect cursor */
        .typing-cursor {
            display: inline-block;
            width: 2px;
            height: 1em;
            background: var(--primary);
            margin-left: 2px;
            animation: blink 0.7s infinite;
        }

        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }

        .input-actions {
            display: flex;
            gap: 4px;
        }

        .input-btn {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .input-btn.file-btn {
            background: var(--bg-card);
            color: var(--text-secondary);
            border: 1px solid var(--border);
        }

        .input-btn.file-btn:hover {
            background: var(--border);
            color: var(--text-primary);
        }

        .input-btn.send-btn {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
        }

        .input-btn.send-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
        }

        .input-btn.send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .input-btn svg {
            width: 20px;
            height: 20px;
        }

        /* File preview */
        .file-preview {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 8px;
            margin-bottom: 12px;
            font-size: 13px;
        }

        .file-preview .file-name {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .file-preview .remove-file {
            cursor: pointer;
            color: var(--text-muted);
            transition: color 0.2s;
        }

        .file-preview .remove-file:hover {
            color: #ef4444;
        }

        /* Welcome message */
        .welcome-message {
            text-align: center;
            padding: 40px 20px;
        }

        .welcome-icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--accent-blue) 100%);
            border-radius: 24px;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            color: white;
            box-shadow: 0 8px 30px rgba(99, 102, 241, 0.3);
        }

        .welcome-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-primary);
        }

        .welcome-subtitle {
            color: var(--text-secondary);
            font-size: 14px;
            max-width: 400px;
            margin: 0 auto;
            line-height: 1.6;
        }

        /* Products in response */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 12px;
            margin-top: 12px;
        }

        .product-card {
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px;
            transition: all 0.2s;
        }

        .product-card:hover {
            border-color: var(--primary);
        }

        .product-name {
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 4px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .product-price {
            color: var(--accent-green);
            font-weight: 600;
            font-size: 14px;
        }

        .product-stock {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 4px;
        }

        /* Hidden file input */
        #file-input {
            display: none;
        }

        /* Manager call button */
        .manager-btn {
            padding: 8px 14px;
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            border-radius: 20px;
            color: #ef4444;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .manager-btn:hover {
            background: #ef4444;
            border-color: #ef4444;
            color: white;
        }

        /* Reset button */
        .reset-btn {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: var(--bg-card);
            color: var(--text-secondary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .reset-btn:hover {
            background: var(--bg-main);
            border-color: var(--primary);
            color: var(--primary);
        }

        /* Responsive */
        @media (max-width: 600px) {
            body {
                padding: 0;
            }
            .chat-container {
                height: 100vh;
                max-height: none;
                border-radius: 0;
            }
            .message {
                max-width: 90%;
            }
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <!-- Header -->
        <div class="chat-header">
            <div class="logo-container">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 2L2 7l10 5 10-5-10-5z"/>
                    <path d="M2 17l10 5 10-5"/>
                    <path d="M2 12l10 5 10-5"/>
                </svg>
            </div>
            <div class="header-info">
                <div class="header-title">
                    Роберт
                    <span class="status-badge bot" id="status-badge">
                        <span class="status-dot bot" id="status-dot"></span>
                        <span id="status-text">онлайн</span>
                    </span>
                </div>
                <div class="header-subtitle" id="header-subtitle">AI-ассистент Over-Shop.kz</div>
            </div>
            <button class="reset-btn" onclick="resetChat()" title="Начать новый чат">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
                    <path d="M3 3v5h5"/>
                </svg>
            </button>
        </div>

        <!-- Messages -->
        <div class="chat-messages" id="chat-messages">
            <div class="welcome-message">
                <div class="welcome-icon">
                    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <path d="M12 2L2 7l10 5 10-5-10-5z"/>
                        <path d="M2 17l10 5 10-5"/>
                        <path d="M2 12l10 5 10-5"/>
                    </svg>
                </div>
                <h2 class="welcome-title">Привет! Я Роберт</h2>
                <p class="welcome-subtitle">
                    Ваш персональный ассистент в Over-Shop.kz.
                    Помогу найти товары, собрать компьютер или отвечу на вопросы о доставке и гарантии.
                </p>
                <div class="suggestions" style="justify-content: center; margin-top: 24px;">
                    <button class="suggestion-btn" onclick="sendSuggestion('Собери мне игровой ПК за 500000 тенге')">Собрать игровой ПК</button>
                    <button class="suggestion-btn" onclick="sendSuggestion('Покажи видеокарты RTX')">Видеокарты RTX</button>
                    <button class="suggestion-btn" onclick="sendSuggestion('Как оформить доставку?')">О доставке</button>
                    <button class="manager-btn" onclick="sendSuggestion('Позови менеджера')">Связаться с менеджером</button>
                </div>
            </div>
        </div>

        <!-- Input Area -->
        <div class="chat-input-area">
            <div id="file-preview" class="file-preview" style="display: none;">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                    <path d="M14 2v6h6"/>
                </svg>
                <span class="file-name" id="file-name"></span>
                <span class="remove-file" onclick="removeFile()">x</span>
            </div>
            <div class="input-container">
                <input type="file" id="file-input" accept="image/*,.pdf,.doc,.docx,.txt" onchange="handleFileSelect(event)">
                <button class="input-btn file-btn" onclick="document.getElementById('file-input').click()" title="Прикрепить файл">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/>
                    </svg>
                </button>
                <textarea
                    class="chat-input"
                    id="chat-input"
                    placeholder="Напишите сообщение... (Shift+Enter для новой строки)"
                    onkeydown="handleKeyDown(event)"
                    rows="1"
                ></textarea>
                <button class="input-btn send-btn" id="send-btn" onclick="sendMessage()" title="Отправить">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M22 2L11 13"/>
                        <path d="M22 2L15 22L11 13L2 9L22 2Z"/>
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <script>
        const API_URL = window.location.origin + '/api/v1';
        let sessionId = localStorage.getItem('chatSessionId') || generateSessionId();
        let selectedFile = null;
        let isFirstMessage = true;
        let currentStatus = 'bot';
        let lastMessageId = 0;
        let pollingInterval = null;
        let managerJoined = false;
        let displayedMessageIds = new Set(); // Track displayed messages to avoid duplicates
        let waitingNotificationShown = false; // Track if waiting notification was already shown

        // Save session ID
        localStorage.setItem('chatSessionId', sessionId);

        function generateSessionId() {
            return 'session-' + Math.random().toString(36).substr(2, 9);
        }

        // Load chat history on page load
        async function loadChatHistory() {
            try {
                // First get status to know last_message_id
                const statusResp = await fetch(`${API_URL}/chat/status/${sessionId}`);
                if (statusResp.ok) {
                    const statusData = await statusResp.json();
                    if (statusData.last_message_id) {
                        lastMessageId = statusData.last_message_id;
                    }
                }

                const response = await fetch(`${API_URL}/chat/history/${sessionId}`);
                if (!response.ok) return;

                const data = await response.json();

                if (data.messages && data.messages.length > 0) {
                    // Clear welcome message and show history
                    document.getElementById('chat-messages').innerHTML = '';
                    isFirstMessage = false;

                    for (const msg of data.messages) {
                        const time = msg.created_at ? new Date(msg.created_at).toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' }) : '';
                        addMessageWithTime(msg.content, msg.role, time);

                        // Track if manager has already joined
                        if (msg.role === 'manager') {
                            managerJoined = true;
                        }
                    }

                    // Mark all existing messages as displayed
                    displayedMessageIds.add(lastMessageId);
                }

                // Update status
                updateStatus(data.status || 'bot');

                // Track notification state based on loaded status
                if (data.status === 'waiting_manager' || data.status === 'manager_active' || managerJoined) {
                    waitingNotificationShown = true; // Don't show again on page reload
                    startPolling();
                }
            } catch (error) {
                console.error('Error loading history:', error);
            }
        }

        // Update status badge
        function updateStatus(status) {
            const badge = document.getElementById('status-badge');
            const dot = document.getElementById('status-dot');
            const text = document.getElementById('status-text');
            const subtitle = document.getElementById('header-subtitle');

            // Remove all status classes
            badge.classList.remove('bot', 'waiting', 'manager');
            dot.classList.remove('bot', 'waiting', 'manager');

            currentStatus = status;

            if (status === 'waiting_manager') {
                badge.classList.add('waiting');
                dot.classList.add('waiting');
                text.textContent = 'ожидаем менеджера';
                subtitle.textContent = 'Менеджер скоро ответит';
            } else if (status === 'manager' || status === 'manager_active' || managerJoined) {
                badge.classList.add('manager');
                dot.classList.add('manager');
                text.textContent = 'менеджер в чате';
                subtitle.textContent = 'Менеджер подключился к диалогу';
            } else {
                badge.classList.add('bot');
                dot.classList.add('bot');
                text.textContent = 'онлайн';
                subtitle.textContent = 'AI-ассистент Over-Shop.kz';
            }
        }

        // Start polling for new messages
        function startPolling() {
            if (pollingInterval) return;
            pollingInterval = setInterval(pollForMessages, 5000); // 5s instead of 3s
        }

        // Stop polling
        function stopPolling() {
            if (pollingInterval) {
                clearInterval(pollingInterval);
                pollingInterval = null;
            }
        }

        // Poll for new messages
        async function pollForMessages() {
            try {
                const response = await fetch(`${API_URL}/chat/status/${sessionId}?last_message_id=${lastMessageId}`);
                if (!response.ok) return;

                const data = await response.json();

                // Handle new messages - check for duplicates
                if (data.new_messages && data.new_messages.length > 0) {
                    for (const msg of data.new_messages) {
                        // Skip if already displayed
                        if (msg.id && displayedMessageIds.has(msg.id)) {
                            continue;
                        }

                        if (msg.content) {
                            // Mark as displayed
                            if (msg.id) displayedMessageIds.add(msg.id);

                            // Check if this is a manager message
                            if (msg.role === 'manager') {
                                if (!managerJoined) {
                                    managerJoined = true;
                                    showSystemNotification('🔵 Менеджер подключился к диалогу');
                                    updateStatus('manager_active');
                                }
                                const time = msg.created_at ? new Date(msg.created_at).toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' }) : new Date().toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
                                addMessageWithTime(msg.content, 'manager', time);
                            }
                            // Only show assistant messages from polling, NOT user messages (user messages shown immediately when sent)
                            else if (msg.role === 'assistant') {
                                const time = msg.created_at ? new Date(msg.created_at).toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' }) : '';
                                addMessageWithTime(msg.content, msg.role, time);
                            }
                            // Skip user messages - they're shown immediately when sent
                        }
                    }
                }

                // Update last message ID
                if (data.last_message_id) {
                    lastMessageId = data.last_message_id;
                }

                // Update status
                if (data.status !== currentStatus) {
                    updateStatus(data.status);

                    // Stop polling if status changed to 'bot' and no manager joined
                    if (data.status === 'bot' && !managerJoined) {
                        stopPolling();
                    }
                }
            } catch (error) {
                console.error('Polling error:', error);
            }
        }

        // Show system notification
        function showSystemNotification(text) {
            const messagesContainer = document.getElementById('chat-messages');
            const notifDiv = document.createElement('div');
            notifDiv.className = 'system-notification';
            notifDiv.textContent = text;
            messagesContainer.appendChild(notifDiv);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        // Status phrases for different actions
        const STATUS_PHRASES = {
            default: [
                'Обрабатываю запрос...',
                'Анализирую...',
                'Думаю над ответом...',
            ],
            build_pc: [
                'Анализирую бюджет...',
                'Подбираю процессор...',
                'Подбираю видеокарту...',
                'Выбираю материнскую плату...',
                'Формирую сборку...',
                'Проверяю совместимость...',
            ],
            search: [
                'Ищу товары...',
                'Проверяю наличие...',
                'Подбираю варианты...',
            ],
            delivery: [
                'Получаю информацию...',
                'Проверяю данные...',
            ],
        };

        let statusPhraseInterval = null;
        let typingEffectEnabled = true;

        function handleKeyDown(event) {
            const input = event.target;

            // Enter sends message, Shift+Enter adds new line
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
                return;
            }

            // Auto-resize textarea
            setTimeout(() => {
                input.style.height = 'auto';
                input.style.height = Math.min(input.scrollHeight, 120) + 'px';
            }, 0);
        }

        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (file) {
                // Check file size (max 5MB)
                if (file.size > 5 * 1024 * 1024) {
                    alert('Файл слишком большой. Максимальный размер: 5 МБ');
                    event.target.value = '';
                    return;
                }

                // Check file type
                const allowedExtensions = ['.jpg', '.jpeg', '.png', '.gif', '.webp', '.pdf', '.doc', '.docx', '.txt'];
                const fileExt = '.' + file.name.split('.').pop().toLowerCase();
                if (!allowedExtensions.includes(fileExt)) {
                    alert('Неподдерживаемый формат файла. Разрешены: ' + allowedExtensions.join(', '));
                    event.target.value = '';
                    return;
                }

                selectedFile = file;
                const filePreview = document.getElementById('file-preview');
                const fileName = document.getElementById('file-name');

                // Check if it's an image
                const isImage = ['.jpg', '.jpeg', '.png', '.gif', '.webp'].includes(fileExt);

                if (isImage) {
                    // Show image thumbnail preview
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        filePreview.innerHTML = `
                            <img src="${e.target.result}" class="file-preview-image" alt="Preview">
                            <span class="file-name">${file.name}</span>
                            <span class="remove-file" onclick="removeFile()">×</span>
                        `;
                        filePreview.style.display = 'flex';
                    };
                    reader.readAsDataURL(file);
                } else {
                    // Show file icon for documents
                    filePreview.innerHTML = `
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                            <path d="M14 2v6h6"/>
                        </svg>
                        <span class="file-name">${file.name}</span>
                        <span class="remove-file" onclick="removeFile()">×</span>
                    `;
                    filePreview.style.display = 'flex';
                }
            }
        }

        function removeFile() {
            selectedFile = null;
            document.getElementById('file-input').value = '';
            document.getElementById('file-preview').style.display = 'none';
        }

        // Detect message type for status phrases
        function detectMessageType(message) {
            const msgLower = message.toLowerCase();
            if (msgLower.includes('сбор') || msgLower.includes('пк') || msgLower.includes('компьютер') || msgLower.includes('бюджет')) {
                return 'build_pc';
            }
            if (msgLower.includes('найди') || msgLower.includes('покажи') || msgLower.includes('поиск') || msgLower.includes('видеокарт') || msgLower.includes('процессор')) {
                return 'search';
            }
            if (msgLower.includes('доставк') || msgLower.includes('адрес') || msgLower.includes('телефон') || msgLower.includes('магазин')) {
                return 'delivery';
            }
            return 'default';
        }

        // Show thinking status with rotating phrases
        function showThinkingStatus(messageType) {
            const messagesContainer = document.getElementById('chat-messages');
            const phrases = STATUS_PHRASES[messageType] || STATUS_PHRASES.default;
            let phraseIndex = 0;

            const statusDiv = document.createElement('div');
            statusDiv.className = 'message assistant';
            statusDiv.id = 'thinking-status';
            statusDiv.innerHTML = `
                <div class="message-avatar">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 2L2 7l10 5 10-5-10-5z"/>
                        <path d="M2 17l10 5 10-5"/>
                        <path d="M2 12l10 5 10-5"/>
                    </svg>
                </div>
                <div class="thinking-status">
                    <svg class="spinner-svg" width="16" height="16" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="12" cy="12" r="10" stroke="rgba(99, 102, 241, 0.3)" stroke-width="3" fill="none"/>
                        <path d="M12 2a10 10 0 0 1 10 10" stroke="#6366f1" stroke-width="3" fill="none" stroke-linecap="round">
                            <animateTransform attributeName="transform" type="rotate" from="0 12 12" to="360 12 12" dur="1s" repeatCount="indefinite"/>
                        </path>
                    </svg>
                    <span id="status-phrase">${phrases[0]}</span>
                </div>
            `;
            messagesContainer.appendChild(statusDiv);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;

            // Rotate phrases every 1.5 seconds
            statusPhraseInterval = setInterval(() => {
                phraseIndex = (phraseIndex + 1) % phrases.length;
                const phraseEl = document.getElementById('status-phrase');
                if (phraseEl) {
                    phraseEl.textContent = phrases[phraseIndex];
                }
            }, 1500);
        }

        function hideThinkingStatus() {
            if (statusPhraseInterval) {
                clearInterval(statusPhraseInterval);
                statusPhraseInterval = null;
            }
            const status = document.getElementById('thinking-status');
            if (status) status.remove();
        }

        // Typing effect for bot messages
        async function typeMessage(element, text, speed = 15) {
            const formattedText = formatMessage(text);
            const tempDiv = document.createElement('div');
            tempDiv.innerHTML = formattedText;

            // Get all text nodes
            const walker = document.createTreeWalker(tempDiv, NodeFilter.SHOW_TEXT, null, false);
            const textNodes = [];
            let node;
            while (node = walker.nextNode()) {
                textNodes.push({ node: node, text: node.textContent });
                node.textContent = '';
            }

            element.innerHTML = tempDiv.innerHTML + '<span class="typing-cursor"></span>';

            // Type each character
            for (const textNode of textNodes) {
                const targetNode = findCorrespondingNode(element, textNode.node);
                if (targetNode) {
                    for (let i = 0; i < textNode.text.length; i++) {
                        targetNode.textContent += textNode.text[i];
                        element.closest('.chat-messages')?.scrollTo(0, element.closest('.chat-messages').scrollHeight);
                        await new Promise(r => setTimeout(r, speed));
                    }
                }
            }

            // Remove cursor
            const cursor = element.querySelector('.typing-cursor');
            if (cursor) cursor.remove();
        }

        function findCorrespondingNode(element, originalNode) {
            const walker = document.createTreeWalker(element, NodeFilter.SHOW_TEXT, null, false);
            let node;
            let count = 0;

            // Count the position of the original node
            const tempDiv = document.createElement('div');
            tempDiv.innerHTML = element.innerHTML.replace('<span class="typing-cursor"></span>', '');
            const origWalker = document.createTreeWalker(tempDiv, NodeFilter.SHOW_TEXT, null, false);
            let origNode;
            let origCount = 0;

            while (origNode = origWalker.nextNode()) {
                if (origNode.textContent === '') {
                    origCount++;
                }
            }

            // Return the last empty text node
            while (node = walker.nextNode()) {
                if (node.textContent === '') {
                    return node;
                }
            }

            // Fallback: find any empty text node
            const fallbackWalker = document.createTreeWalker(element, NodeFilter.SHOW_TEXT, null, false);
            while (node = fallbackWalker.nextNode()) {
                if (node.textContent === '' || node === originalNode) {
                    return node;
                }
            }

            return null;
        }

        function sendSuggestion(text) {
            document.getElementById('chat-input').value = text;
            sendMessage();
        }

        async function resetChat() {
            if (!confirm('Вы точно хотите удалить историю чата?')) return;

            try {
                // Call API to delete session
                await fetch(`${API_URL}/chat/reset/${sessionId}`, { method: 'POST' });
            } catch (e) {
                console.log('Reset API error (continuing anyway):', e);
            }

            // Generate new session ID
            sessionId = generateSessionId();
            localStorage.setItem('chatSessionId', sessionId);

            // Reset state
            isFirstMessage = true;
            currentStatus = 'bot';
            lastMessageId = 0;
            managerJoined = false;
            waitingNotificationShown = false;
            displayedMessageIds.clear();
            stopPolling();

            // Reset UI to welcome message
            document.getElementById('chat-messages').innerHTML = `
                <div class="welcome-message">
                    <div class="welcome-icon">
                        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                            <path d="M12 2L2 7l10 5 10-5-10-5z"/>
                            <path d="M2 17l10 5 10-5"/>
                            <path d="M2 12l10 5 10-5"/>
                        </svg>
                    </div>
                    <h2 class="welcome-title">Привет! Я Роберт</h2>
                    <p class="welcome-subtitle">
                        Ваш персональный ассистент в Over-Shop.kz.
                        Помогу найти товары, собрать компьютер или отвечу на вопросы о доставке и гарантии.
                    </p>
                    <div class="suggestions" style="justify-content: center; margin-top: 24px;">
                        <button class="suggestion-btn" onclick="sendSuggestion('Собери мне игровой ПК за 500000 тенге')">Собрать игровой ПК</button>
                        <button class="suggestion-btn" onclick="sendSuggestion('Покажи видеокарты RTX')">Видеокарты RTX</button>
                        <button class="suggestion-btn" onclick="sendSuggestion('Как оформить доставку?')">О доставке</button>
                        <button class="manager-btn" onclick="sendSuggestion('Позови менеджера')">Связаться с менеджером</button>
                    </div>
                </div>
            `;

            // Reset status badge
            updateStatus('bot');
        }

        // Store image data URL for display before upload
        let pendingImageDataUrl = null;

        async function sendMessage() {
            const input = document.getElementById('chat-input');
            const message = input.value.trim();

            if (!message && !selectedFile) return;

            // Clear welcome message on first real message
            if (isFirstMessage) {
                document.getElementById('chat-messages').innerHTML = '';
                isFirstMessage = false;
            }

            // Check if we're sending an image
            let imageToShow = null;
            if (selectedFile) {
                const fileExt = '.' + selectedFile.name.split('.').pop().toLowerCase();
                const isImage = ['.jpg', '.jpeg', '.png', '.gif', '.webp'].includes(fileExt);
                if (isImage) {
                    // Get the preview image data URL
                    const previewImg = document.querySelector('.file-preview-image');
                    if (previewImg) {
                        imageToShow = previewImg.src;
                    }
                }
            }

            // Add user message to chat (with image if applicable)
            addMessageWithImage(message, 'user', imageToShow);
            input.value = '';
            input.style.height = 'auto'; // Reset textarea height

            // Detect message type and show thinking status
            const messageType = detectMessageType(message);
            showThinkingStatus(messageType);

            try {
                let requestBody = {
                    message: message,
                    session_id: sessionId
                };

                // If file is selected, send as FormData
                if (selectedFile) {
                    const formData = new FormData();
                    formData.append('message', message);
                    formData.append('session_id', sessionId);
                    formData.append('file', selectedFile);

                    const response = await fetch(`${API_URL}/chat/upload`, {
                        method: 'POST',
                        body: formData
                    });

                    hideThinkingStatus();

                    if (!response.ok) {
                        throw new Error('File upload failed');
                    }

                    const data = await response.json();
                    if (data.message) {
                        await addMessageWithTypingEffect(data.message, 'assistant');
                    }
                } else {
                    const response = await fetch(`${API_URL}/chat`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify(requestBody)
                    });

                    hideThinkingStatus();

                    if (!response.ok) {
                        throw new Error('Network response was not ok');
                    }

                    const data = await response.json();

                    // Add assistant response with typing effect
                    if (data.message) {
                        await addMessageWithTypingEffect(data.message, 'assistant');
                    }

                    // Update lastMessageId to prevent duplicate from polling
                    const statusResp = await fetch(`${API_URL}/chat/status/${sessionId}`);
                    if (statusResp.ok) {
                        const statusData = await statusResp.json();
                        if (statusData.last_message_id) {
                            lastMessageId = statusData.last_message_id;
                            displayedMessageIds.add(statusData.last_message_id);
                        }
                    }

                    // Check if waiting for manager - only show notification ONCE
                    if (data.data && data.data.status === 'waiting_manager' && !managerJoined && !waitingNotificationShown) {
                        updateStatus('waiting_manager');
                        showSystemNotification('🟡 Ожидаем подключения менеджера...');
                        waitingNotificationShown = true;
                        startPolling();
                    } else if (data.data && (data.data.status === 'waiting_manager' || data.data.status === 'manager_active')) {
                        // Just start polling if not already started, without showing notification
                        startPolling();
                    }
                }

            } catch (error) {
                hideThinkingStatus();
                console.error('Error:', error);
                await addMessageWithTypingEffect('Извините, произошла ошибка. Пожалуйста, попробуйте позже.', 'assistant');
            }

            // Clear file if any
            removeFile();
        }

        // Add message with typing effect for bot responses
        async function addMessageWithTypingEffect(text, role) {
            const messagesContainer = document.getElementById('chat-messages');
            const time = new Date().toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });

            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${role}`;

            const avatar = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 2L2 7l10 5 10-5-10-5z"/>
                <path d="M2 17l10 5 10-5"/>
                <path d="M2 12l10 5 10-5"/>
            </svg>`;

            messageDiv.innerHTML = `
                <div class="message-avatar">${avatar}</div>
                <div>
                    <div class="message-content"></div>
                    <div class="message-time">${time}</div>
                </div>
            `;

            messagesContainer.appendChild(messageDiv);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;

            // Get the content element and type the message
            const contentElement = messageDiv.querySelector('.message-content');

            if (typingEffectEnabled && text.length < 2000) {
                // Use word-by-word typing for smoother effect
                await typeMessageByWords(contentElement, text);
            } else {
                // For very long messages, show immediately
                contentElement.innerHTML = formatMessage(text);
            }

            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        // Type message word by word (smoother than character by character)
        async function typeMessageByWords(element, text, wordDelay = 30) {
            const formattedText = formatMessage(text);

            // Split by HTML tags and words
            const parts = formattedText.split(/(<[^>]+>)/);
            element.innerHTML = '<span class="typing-cursor"></span>';

            let htmlContent = '';

            for (const part of parts) {
                if (part.startsWith('<') && part.endsWith('>')) {
                    // HTML tag - add immediately
                    htmlContent += part;
                    element.innerHTML = htmlContent + '<span class="typing-cursor"></span>';
                } else if (part.trim()) {
                    // Text content - type word by word
                    const words = part.split(/(\s+)/);
                    for (const word of words) {
                        htmlContent += word;
                        element.innerHTML = htmlContent + '<span class="typing-cursor"></span>';
                        element.closest('.chat-messages')?.scrollTo(0, element.closest('.chat-messages').scrollHeight);
                        if (word.trim()) {
                            await new Promise(r => setTimeout(r, wordDelay));
                        }
                    }
                }
            }

            // Remove cursor
            const cursor = element.querySelector('.typing-cursor');
            if (cursor) cursor.remove();
        }

        function addMessage(text, role, data = null) {
            const time = new Date().toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
            addMessageWithTime(text, role, time);
        }

        // Add message with optional image (for user uploads)
        function addMessageWithImage(text, role, imageUrl = null) {
            const messagesContainer = document.getElementById('chat-messages');
            const time = new Date().toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });

            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${role}`;

            let avatar;
            if (role === 'user') {
                avatar = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                    <circle cx="12" cy="7" r="4"/>
                </svg>`;
            } else {
                avatar = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 2L2 7l10 5 10-5-10-5z"/>
                    <path d="M2 17l10 5 10-5"/>
                    <path d="M2 12l10 5 10-5"/>
                </svg>`;
            }

            // Build content with optional image
            let contentHtml = '';
            if (imageUrl) {
                contentHtml += `<img src="${imageUrl}" class="message-image" alt="Uploaded image" onclick="window.open(this.src, '_blank')">`;
            }
            if (text) {
                contentHtml += `<div>${formatMessage(text)}</div>`;
            }

            messageDiv.innerHTML = `
                <div class="message-avatar">${avatar}</div>
                <div>
                    <div class="message-content">${contentHtml}</div>
                    <div class="message-time">${time}</div>
                </div>
            `;

            messagesContainer.appendChild(messageDiv);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function addMessageWithTime(text, role, time) {
            const messagesContainer = document.getElementById('chat-messages');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${role}`;

            let avatar;
            if (role === 'assistant') {
                avatar = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 2L2 7l10 5 10-5-10-5z"/>
                    <path d="M2 17l10 5 10-5"/>
                    <path d="M2 12l10 5 10-5"/>
                </svg>`;
            } else if (role === 'manager') {
                avatar = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                    <circle cx="12" cy="7" r="4"/>
                    <path d="M16 11l2 2 4-4"/>
                </svg>`;
            } else {
                avatar = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                    <circle cx="12" cy="7" r="4"/>
                </svg>`;
            }

            messageDiv.innerHTML = `
                <div class="message-avatar">${avatar}</div>
                <div>
                    <div class="message-content">${formatMessage(text)}</div>
                    <div class="message-time">${time}</div>
                </div>
            `;

            messagesContainer.appendChild(messageDiv);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function showTyping() {
            const messagesContainer = document.getElementById('chat-messages');
            const typingDiv = document.createElement('div');
            typingDiv.className = 'message assistant';
            typingDiv.id = 'typing-indicator';
            typingDiv.innerHTML = `
                <div class="message-avatar">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 2L2 7l10 5 10-5-10-5z"/>
                        <path d="M2 17l10 5 10-5"/>
                        <path d="M2 12l10 5 10-5"/>
                    </svg>
                </div>
                <div class="typing-indicator">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
            `;
            messagesContainer.appendChild(typingDiv);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function hideTyping() {
            const typing = document.getElementById('typing-indicator');
            if (typing) typing.remove();
        }

        function formatMessage(text) {
            // Convert markdown-like formatting to HTML
            return escapeHtml(text)
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                .replace(/\*(.*?)\*/g, '<em>$1</em>')
                .replace(/\n/g, '<br>');
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Load history and focus input on load
        loadChatHistory();
        document.getElementById('chat-input').focus();
    </script>
